<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niño Gritando – Tesis Inteligentes</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#1a0000}
#bg{position:fixed;inset:0;background:radial-gradient(circle,#7a0000,#1a0000);animation:pulse .4s infinite alternate}
@keyframes pulse{from{opacity:.75}to{opacity:1}}
#cap{position:absolute;top:4%;width:100%;text-align:center;color:#fff;font-weight:900;font-size:clamp(16px,4.5vw,32px);text-shadow:0 2px 0 #000;z-index:5}
#cap span{color:#ff5252}
.kid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:220px;height:270px;animation:shake .12s infinite}
@keyframes shake{0%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% + 5px),calc(-50% - 4px))}50%{transform:translate(calc(-50% - 5px),calc(-50% + 4px))}75%{transform:translate(calc(-50% + 4px),calc(-50% + 3px))}100%{transform:translate(-50%,-50%)}}
.hair{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:164px;height:82px;background:#5a3b1e;border-radius:82px 82px 0 0;z-index:3}
.head{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:152px;height:152px;background:#ffd9b3;border-radius:50%;z-index:2}
.eye{position:absolute;top:56px;font:900 30px Arial;color:#333;z-index:4}
.eye.l{left:62px}.eye.r{right:62px}
.tear{position:absolute;top:74px;width:12px;height:16px;background:#7fd4ff;border-radius:50% 50% 60% 60%;animation:tear .7s infinite;z-index:4}
.tear.l{left:52px;--dx:-46px}.tear.r{right:52px;--dx:46px}
@keyframes tear{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),56px)}}
.mouth{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:62px;height:74px;background:#7a1a1a;border-radius:50%;overflow:hidden;animation:mouth .16s infinite alternate;z-index:4}
@keyframes mouth{from{transform:translateX(-50%) scaleY(.7)}to{transform:translateX(-50%) scaleY(1.2)}}
.tongue{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:36px;height:26px;background:#e25555;border-radius:50%}
.arm{position:absolute;top:70px;width:18px;height:95px;background:#ffd9b3;border-radius:10px;z-index:1}
.arm.l{left:14px;transform:rotate(32deg)}.arm.r{right:14px;transform:rotate(-32deg)}
.body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:122px;height:92px;background:#2e86de;border-radius:32px 32px 12px 12px}
.wave{position:absolute;left:50%;top:52%;border:4px solid #fff;border-radius:50%;opacity:0;transform:translate(-50%,-50%);animation:wave 1s infinite;z-index:0}
.wave:nth-child(2){animation-delay:.33s}.wave:nth-child(3){animation-delay:.66s}
@keyframes wave{0%{opacity:.9;width:20px;height:20px}100%{opacity:0;width:360px;height:360px}}
.aah{position:absolute;font-weight:900;color:#ffdd57;text-shadow:0 0 12px #f00;animation:floaty 1.2s infinite;z-index:6}
@keyframes floaty{0%{opacity:0;transform:translateY(12px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1.35)}}
#start{position:absolute;inset:0;z-index:9;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fbb}
#start button{font-size:22px;font-weight:900;padding:16px 34px;border:0;border-radius:40px;background:#ff1744;color:#fff;cursor:pointer;box-shadow:0 0 30px #ff1744}
</style>
</head>
<body>
<div id="bg"></div>
<div id="cap">YO CUANDO EL TUTOR ME ESCRIBE:<br><span>“hay que replantear TODO el marco teórico”</span></div>
<div class="wave"></div><div class="wave"></div><div class="wave"></div>
<div class="kid">
  <div class="hair"></div>
  <div class="head"></div>
  <span class="eye l">&gt;</span><span class="eye r">&lt;</span>
  <div class="tear l"></div><div class="tear r"></div>
  <div class="mouth"><div class="tongue"></div></div>
  <div class="arm l"></div><div class="arm r"></div>
  <div class="body"></div>
</div>
<span class="aah" style="left:12%;top:30%;font-size:34px">¡AAAAH!</span>
<span class="aah" style="right:10%;top:26%;font-size:44px;animation-delay:.4s">¡AAAAHH!</span>
<span class="aah" style="left:18%;bottom:22%;font-size:28px;animation-delay:.8s">¡AAAAH!</span>
<span class="aah" style="right:16%;bottom:30%;font-size:38px;animation-delay:.2s">¡AAAAHHH!</span>
<div id="start"><button onclick="begin()">▶ QUE GRITE</button><p>🔴 Activa la grabación de pantalla ANTES de darle play</p></div>
<script>
let AC=null,NB=null;
const ctx=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
function noise(){const c=ctx();if(!NB){NB=c.createBuffer(1,c.sampleRate*2,c.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return NB;}
function scream(t,dur,f0){
  const c=ctx();
  const o1=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter();
  fl.type='lowpass';fl.frequency.value=4200;fl.Q.value=2;
  o1.type='sawtooth';o2.type='sawtooth';o2.detune.value=15;
  o1.frequency.setValueAtTime(f0,t);
  o1.frequency.linearRampToValueAtTime(f0*1.5,t+0.12);
  o1.frequency.linearRampToValueAtTime(f0*1.1,t+dur);
  o2.frequency.setValueAtTime(f0*2,t);
  o2.frequency.linearRampToValueAtTime(f0*2.3,t+0.12);
  o2.frequency.linearRampToValueAtTime(f0*1.6,t+dur);
  const lfo=c.createOscillator(),lg=c.createGain();
  lfo.type='sine';lfo.frequency.value=28;lg.gain.value=60;
  lfo.connect(lg);lg.connect(o1.frequency);lg.connect(o2.frequency);
  const n=c.createBufferSource(),nf=c.createBiquadFilter(),ng=c.createGain();
  n.buffer=noise();nf.type='bandpass';nf.frequency.value=2500;nf.Q.value=.7;
  ng.gain.setValueAtTime(0.0001,t);ng.gain.exponentialRampToValueAtTime(.12,t+.05);ng.gain.exponentialRampToValueAtTime(.0001,t+dur);
  n.connect(nf);nf.connect(ng);ng.connect(c.destination);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(.5,t+.06);
  g.gain.setValueAtTime(.5,Math.max(t+.06,t+dur-.15));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o1.connect(g);o2.connect(g);g.connect(fl);fl.connect(c.destination);
  o1.start(t);o2.start(t);lfo.start(t);n.start(t);
  n.stop(t+dur+.1);o1.stop(t+dur+.1);o2.stop(t+dur+.1);lfo.stop(t+dur+.1);
}
function begin(){
  document.getElementById('start').style.display='none';
  const c=ctx();c.resume();const t0=c.currentTime+0.1;
  scream(t0,1.1,950);
  scream(t0+1.4,0.8,1100);
  scream(t0+2.5,1.6,850);
  scream(t0+4.4,2.0,1000);
}
</script>
</body>
</html>
