<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive, filterable gallery of Latter-day Saint temples.">
  <title>Filtered Temple Album</title>
  <link rel="stylesheet" href="filtered-temples.css">
</head>
<body>
  <header>
    <h1>Temple Album</h1>
    <nav aria-label="Temple filtering navigation">
      <ul>
        <li><a href="#" class="nav-filter" data-filter="home">Home</a></li>
        <li><a href="#" class="nav-filter" data-filter="old">Old</a></li>
        <li><a href="#" class="nav-filter" data-filter="new">New</a></li>
        <li><a href="#" class="nav-filter" data-filter="large">Large</a></li>
        <li><a href="#" class="nav-filter" data-filter="small">Small</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="temple-cards" class="temple-grid">
      <!-- Temple cards will be dynamically injected here by JavaScript -->
    </section>
  </main>

  <footer>
    <p>&copy; <span id="copyright-year"></span> Florangel Salgado | All rights reserved.</p>
    <p id="last-modified"></p>
  </footer>

  <script src="filtered-temples.js"></script>
</body>
</html>
